services:
  - type: web
    name: aproxi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: APROXI_PROVEDOR
        value: groq
      - key: APROXI_MODELO
        value: openai/gpt-oss-120b
      - key: APROXI_MAX_TOKENS
        value: "4000"
      - key: APROXI_REASONING_EFFORT
        value: low
      - key: GROQ_API_KEY
        sync: false
      - key: APROXI_SENHA
        sync: false
